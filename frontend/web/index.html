<body>
  <!-- Firebase scripts for web (compat version, matches firebase-messaging-sw.js) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXoRO7sp49PotOrUEPmTsbRxCpcDpdyZ0",
      authDomain: "pulse-yourmoney.firebaseapp.com",
      projectId: "pulse-yourmoney",
      storageBucket: "pulse-yourmoney.firebasestorage.app",
      messagingSenderId: "267395124760",
      appId: "1:267395124760:web:93231e40b80650ccf9bd6d"
    };
    firebase.initializeApp(firebaseConfig);
    const messaging = firebase.messaging();
    window.firebaseMessaging = messaging;

    // 👇👇👇 ДОБАВЛЕННЫЙ БЛОК 👇👇👇
    // Регистрация Service Worker для FCM
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('firebase-messaging-sw.js')
        .then(function (registration) {
          console.log('✅ Service Worker registered');
          // Привязываем Service Worker к Firebase Messaging
          if (window.firebaseMessaging) {
            window.firebaseMessaging.useServiceWorker(registration);
          }
        })
        .catch(function (err) {
          console.log('❌ Service Worker registration failed: ', err);
        });
    }
    // 👆👆👆 КОНЕЦ ДОБАВЛЕННОГО БЛОКА 👆👆👆
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
