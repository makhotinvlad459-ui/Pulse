name: frontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  riverpod: ^2.4.9
  reorderable_grid: ^1.0.8
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.0
  flutter_secure_storage: ^9.0.0
  flutter_secure_storage_web: ^1.1.2
  image_picker: ^1.0.5
  fl_chart: ^1.1.0
  intl: ^0.20.2
  table_calendar: ^3.0.9
  path_provider: ^2.1.1
  file_picker: ^8.1.4
  flutter_image_compress: ^2.1.0
  photo_view: ^0.14.0
  google_fonts: ^6.1.0
  audioplayers: ^6.0.0
  local_auth: ^2.1.6
  background: ^1.3.0
  universal_html: ^2.3.0
  shared_preferences: ^2.2.2
  shimmer: ^3.0.0
  excel: ^2.1.0
  webview_flutter: ^4.4.0
  in_app_purchase: ^3.2.0
  url_launcher: ^6.3.0
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

  web_socket_channel: ^3.0.0
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.0
  permission_handler: ^11.0.0
  share_plus: ^10.1.4

  
  flutter_localizations:
    sdk: flutter

  http: any
  video_player: any
  image: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/videos/city.mp4
    - assets/videos/dark1.mp4
    - assets/videos/city_blue.mp4
    - assets/videos/city_green.mp4
     
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"  # ← ИСПРАВЛЕНО (путь должен быть правильным)
  remove_alpha_ios: true  
  adaptive_icon_background: "#000000" 
  adaptive_icon_foreground: "assets/logo_foreground.png"  # ← Убедись, что файл существует
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#000000"
    theme_color: "#000000"
    favicon_generation: true